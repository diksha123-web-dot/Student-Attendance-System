<!DOCTYPE html>
<html>
<head>
    <title>Student Sign-Up</title>
    <style>
        body {
            background-color: #f5f0e6; /* Light beige */
            font-family: Arial, sans-serif;
        }
        .container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: #fffaf2; /* Cream background */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(139, 69, 19, 0.15); /* Brown shadow */
            text-align: center;
        }
        h2 {
            color: #8b4513; /* SaddleBrown */
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #a0522d; /* Sienna border */
        }
        button {
            padding: 10px 20px;
            background-color: #a0522d; /* Sienna */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #7b3f00; /* Darker brown */
        }
        a {
            text-decoration: none;
            color: #a0522d;
        }
        .flash {
            color: #b22222; /* Firebrick */
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Sign-Up</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="name" placeholder="Full Name" required><br>
            <input type="email" name="email" placeholder="Email" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="/login">Login here</a>.</p>
    </div>
</body>
</html>
