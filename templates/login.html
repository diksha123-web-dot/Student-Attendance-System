<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <style>
        body {
            background-color: #f5efe6; /* light beige-brown */
            font-family: Arial, sans-serif;
        }
        .container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(102, 51, 0, 0.2); /* subtle brown shadow */
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #a9746e; /* brownish border */
        }
        button {
            padding: 10px 20px;
            background-color: #8b4513; /* saddle brown */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #5c2f0a; /* darker brown on hover */
        }
        a {
            text-decoration: none;
            color: #8b4513; /* brown links */
        }
        a:hover {
            color: #5c2f0a; /* darker brown on hover */
        }
        .flash {
            color: #b22222; /* firebrick red for error messages */
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Login</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="email" name="email" placeholder="Email" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/signup">Sign up here</a>.</p>
        <p><a href="/login_choice">Back to Login Options</a></p>
    </div>
</body>
</html>
